/* Layout: one 16:9 black stage in the 3Blue1Brown manner, chapter tabs above it, caption, controls and spec notes below. */
:root{
  --bg:#0b0b0c; --stage:#000000; --panel:#141417; --rule:#2b2b31;
  --ink:#ececec; --dim:#a0a0a6; --faint:#62626a;
  --blue:#58c4dd; --blue-l:#9cdceb; --red:#fc6255; --yellow:#f7d96f; --gold:#f0ac5f;
  --green:#83c167; --teal:#5cd0b3; --purple:#b189c6; --grey:#8a8a90;
  --serif:"KaTeX_Main","Latin Modern Roman","CMU Serif","Times New Roman",serif;
  --math:"KaTeX_Math","Latin Modern Math","CMU Serif","Times New Roman",serif;
  --mono:"KaTeX_Typewriter","Latin Modern Mono",ui-monospace,Menlo,monospace;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);margin:0}
[hidden]{display:none!important}
.wrap{max-width:1160px;margin:0 auto;padding-inline:16px;padding-block:18px 36px;display:grid;gap:14px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 24px}
.top h1{font-weight:400;font-size:clamp(20px,2.4vw,26px);margin:0;text-wrap:balance}
.chapters{display:flex;flex-wrap:wrap;gap:2px 18px}
.chapters button{all:unset;cursor:pointer;color:var(--dim);font:17px var(--serif);padding:4px 0;border-bottom:2px solid transparent}
.chapters button:hover{color:var(--ink)}
.chapters button[aria-current="true"]{color:var(--ink);border-color:var(--yellow)}
.chapters button:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.stagebox{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:var(--stage);border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px var(--rule)}
#stage{display:block;width:100%;height:100%}
#stage text{white-space:pre;font-family:var(--serif)}
#stage .mi{font-family:var(--math);font-style:italic}
#stage .co{font-family:var(--mono)}
#stage .bo{font-weight:700}
.bigplay{position:absolute;left:50%;bottom:4.5%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:10px 22px 10px 16px;border-radius:999px;border:1px solid var(--faint);background:rgba(0,0,0,.72);color:var(--ink);font:500 16px var(--ui);cursor:pointer}
.bigplay:hover{border-color:var(--yellow)}
.bigplay:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;font-family:var(--ui)}
.controls button{all:unset;cursor:pointer;display:grid;place-items:center;width:38px;height:38px;border-radius:8px;color:var(--ink);background:var(--panel);box-shadow:inset 0 0 0 1px var(--rule)}
.controls button:hover{box-shadow:inset 0 0 0 1px var(--faint)}
.controls button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.scrub{flex:1 1 200px;min-width:0;height:38px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.scrub:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.track{position:relative;width:100%;height:4px;background:var(--rule);border-radius:2px}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--yellow);border-radius:2px}
.knob{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--yellow)}
.tick{position:absolute;top:-4px;width:2px;height:12px;margin-left:-1px;background:var(--faint)}
.time{font-variant-numeric:tabular-nums;color:var(--dim);font-size:14px;min-width:84px;text-align:right}
.speed{font:14px var(--ui);color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:8px;height:38px;padding:0 8px}
.caption{margin:2px auto 0;max-width:64ch;text-align:center;font-size:clamp(17px,1.9vw,21px);line-height:1.55;min-height:4.7em;text-wrap:pretty}
.caption code,.note code{font-family:var(--mono);font-size:.9em;color:var(--blue-l)}
.caption .pi,.note .pi{font-family:var(--math);font-style:italic}
.spec{max-width:80ch;margin:0 auto;width:100%;border-top:1px solid var(--rule);padding-top:10px;color:var(--dim)}
.spec summary{cursor:pointer;font:15px var(--ui);color:var(--dim)}
.spec summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.note{font-size:16px;line-height:1.6;margin:10px 0 0}
.keys{font:13px var(--ui);color:var(--dim);text-align:center;margin:0}
.narrow{display:none}
@media (max-width:700px) and (orientation:portrait){.narrow{display:block}}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <h1>Private, post-quantum secure transfer under EIP-8288</h1>
    <nav class="chapters" id="chapters" aria-label="Chapters"></nav>
  </header>
  <div class="stagebox">
    <svg id="stage" viewBox="0 0 1600 900" role="img" aria-label="Animation of a private, post-quantum secure transfer from a wallet through the mempool to a block, with a shielded pool contract as its sender">
      <defs id="defs">
        <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="0.8" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
      </defs>
      <rect width="1600" height="900" fill="#000"/>

<script>
(() => {

const tok = (n) => cs.getPropertyValue(n).trim();
const C = {

/* ---------------- engine: every property is a pure function of time, so any frame can be rendered directly ---------------- */
const sig = (x) => 1 / (1 + Math.exp(-x));

class Anim {

}
const CAM = new Anim({cx: 800, cy: 450, z: 1});

function mk(tag, at, parent) {

const rr = (x, y, w, h, r) => {

};

function shape(m, d, o = {}) {

}

/* Rich text: <m>math</m>, <c>code</c>, <b>bold</b>, <sub>, <sup>, <k=color>. */
function rich(parent, x, y, str, o = {}) {
  const size = o.size || 24;
  const t = mk('text', {x, y, 'font-size': size, fill: o.fill || C.ink, 'text-anchor': o.anchor || 'start'}, parent);
  const parts = String(str).split(/(<\/?(?:m|c|b|sub|sup|k)(?:=[a-zA-Z]+)?>)/);
  const stack = []; let shift = 0;
  for (const p of parts) {
    if (!p) continue;
    const tag = p.match(/^<(\/?)(m|c|b|sub|sup|k)(?:=([a-zA-Z]+))?>$/);
    if (tag) { if (tag[1]) stack.pop(); else stack.push([tag[2], tag[3]]); continue; }
    const ts = mk('tspan', {}, t);
    const cls = []; let want = 0, rel = 1, fill = null;
    for (const [g, arg] of stack) {
      if (g === 'm') cls.push('mi'); else if (g === 'c') cls.push('co'); else if (g === 'b') cls.push('bo');
      else if (g === 'sub') { want = 0.28; rel = 0.7; } else if (g === 'sup') { want = -0.42; rel = 0.7; }

}

/* ---------------- building blocks ---------------- */
function Txt(x, y, s, o = {}) { const m = new M(x, y, o.parent, o.o); rich(m.inner, 0, 0, s, o); return m; }
function Card(x, y, w, h, col, o = {}) {
  const m = new M(x + w / 2, y + h / 2, o.parent, o.o);
  m.w = w; m.h = h;
  shape(m, rr(-w / 2, -h / 2, w, h, o.r ?? 16), {stroke: col, sw: o.sw ?? 3, fill: o.fill ?? col, fo: o.fo ?? 0.07, dash: o.dash});
  return m;
}
const at = (card, lx, ly) => [lx - card.w / 2, ly - card.h / 2]; // a card's top-left coordinates, in its local frame
function CT(card, lx, ly, s, o = {}) { const [x, y] = at(card, lx, ly); return Txt(x, y, s, {...o, parent: card}); }
function Row(card, ly, label, value, vx, o = {}) {
  const [x, y] = at(card, 0, ly);
  const m = new M(x, y, card, 0);
  rich(m.inner, o.lx ?? 22, 0, label, {size: o.size ?? 22, fill: C.dim});

}
function Chip(x, y, label, col, o = {}) {

  const m = new M(x, y, o.parent, o.o);

}
function CChip(card, lx, ly, label, col, o = {}) { const [x, y] = at(card, lx, ly); return Chip(x, y, label, col, {...o, parent: card}); }
function CBox(card, lx, ly, w, h, col, o = {}) {
  const [x, y] = at(card, lx + w / 2, ly + h / 2);
  const m = new M(x, y, card, 0);
  m.w = w; m.h = h;
  shape(m, rr(-w / 2, -h / 2, w, h, o.r ?? 12), {stroke: col, sw: o.sw ?? 2, fill: o.fill, fo: o.fo});
  return m;
}
function CLine(card, x1, y1, x2, y2, col) {
  const m = new M(0, 0, card, 0);
  const [a, b] = at(card, x1, y1), [c, d] = at(card, x2, y2);
  shape(m, `M${a},${b} L${c},${d}`, {stroke: col, sw: 1.6});
  return m;
}
function Token(x, y, sym, col, o = {}) {
  const r = o.r ?? 34;
  const m = new M(x, y, o.parent, o.o);
  shape(m, circ(0, 0, r), {stroke: col, sw: o.sw ?? 3.5, fill: col, fo: 0.18});
  rich(m.inner, 0, r * 0.36, sym, {size: r * 1.1, fill: col, anchor: 'middle'});
  return m;
}
function Arrow(x1, y1, x2, y2, col, o = {}) {
  const m = new M(0, 0, o.parent, 0);
  let d, ang;
  if (o.bend) {
    const L = Math.hypot(x2 - x1, y2 - y1);
    const cx = (x1 + x2) / 2 - (y2 - y1) / L * o.bend, cy = (y1 + y2) / 2 + (x2 - x1) / L * o.bend;

  } else { d = `M${x1},${y1} L${x2},${y2}`; ang = Math.atan2(y2 - y1, x2 - x1); }

}
function Curve(d, col, o = {}) { const m = new M(0, 0, o.parent, 0); shape(m, d, {stroke: col, sw: o.sw ?? 2.5}); m.pathD = d; return m; }
function Flash(d, col, o = {}) {

  return m;
}
function Check(x, y, col, o = {}) {
  const k = o.k ?? 1, m = new M(x, y, o.parent, o.o);
  shape(m, `M${-12 * k},0 L${-4 * k},${9 * k} L${13 * k},${-11 * k}`, {stroke: col, sw: o.sw ?? 4.5});
  return m;
}
function Cross(x, y, col, o = {}) {
  const k = o.k ?? 1, m = new M(x, y, o.parent, o.o);
  shape(m, `M${-10 * k},${-10 * k} L${10 * k},${10 * k} M${10 * k},${-10 * k} L${-10 * k},${10 * k}`, {stroke: col, sw: o.sw ?? 4.5});
  return m;
}
function Lock(x, y, col, o = {}) {
  const k = o.k ?? 1, m = new M(x, y, o.parent, o.o);
  shape(m, `M${-8 * k},${-3 * k} V${-10 * k} A${8 * k},${8 * k} 0 0 1 ${8 * k},${-10 * k} V${-3 * k}`, {stroke: col, sw: 3, draw: false});

  return m;
}
function Node(x, y, o = {}) {
  const r = o.r ?? 32, col = o.col ?? C.purple, m = new M(x, y, null, 0);
  shape(m, circ(0, 0, r), {stroke: col, sw: 3, fill: col, fo: 0.14, draw: false});

  m.px = x; m.py = y; m.r = r;
  return m;
}
function Edge(a, b, o = {}) {

  const m = new M(0, 0, null, 0);
  shape(m, `M${x1},${y1} L${x2},${y2}`, {stroke: o.col ?? C.faint, sw: o.sw ?? 2.5});
  return m;
}
function NoteCard(cx, cy, amt) {
  const w = 190, h = 64, m = new M(cx, cy, null, 0);
  shape(m, `M${-w / 2},${-h / 2} H${w / 2 - 16} L${w / 2},${-h / 2 + 16} V${h / 2} H${-w / 2} Z`, {stroke: C.red, sw: 3, fill: C.red, fo: 0.12});
  shape(m, `M${w / 2 - 16},${-h / 2} V${-h / 2 + 16} H${w / 2}`, {stroke: C.red, sw: 2});
  rich(m.inner, -w / 2 + 16, 8, 'note', {size: 20, fill: C.dim});
  rich(m.inner, w / 2 - 18, 10, amt, {size: 28, anchor: 'end'});
  return m;
}
function MiniEnv(x, y) {
  const m = new M(x, y, null, 0);
  shape(m, rr(-28, -20, 56, 40, 6), {stroke: C.yellow, sw: 2, dash: '5 4', fill: C.yellow, fo: 0.05});
  shape(m, rr(-21, -12, 20, 24, 3), {stroke: C.ink, sw: 1.8, draw: false});
  shape(m, circ(11, 0, 9), {stroke: C.yellow, sw: 2, fill: C.yellow, fo: 0.25, draw: false});
  return m;
}
function Tile(x, y, col) {
  const m = new M(x, y, null, 0);
  shape(m, rr(-22, -15, 44, 30, 6), {stroke: col, sw: 2.2, fill: col, fo: 0.1, draw: false});
  rich(m.inner, 0, 6, 'tx', {size: 15, fill: col, anchor: 'middle'});
  return m;
}
/* A small Merkle tree: 8 leaves, `filled` of them already used. */
function Tree(card, lx, ly, k, filled, col, newCol) {
  const [x, y] = at(card, lx, ly);
  const g = new M(x, y, card, 0);
  const R = [110, 0], L1 = [[50, 48], [170, 48]], L2 = [[20, 96], [80, 96], [140, 96], [200, 96]];
  const LV = [5, 35, 65, 95, 125, 155, 185, 215].map((v) => [v, 144]);
  const S = (p) => [p[0] * k, p[1] * k];
  let d = '';
  const seg = (p, q) => { const [a, b] = S(p), [c, e] = S(q); d += `M${a},${b} L${c},${e} `; };
  L1.forEach((p) => seg(R, p));
  L2.forEach((p, i) => seg(L1[i >> 1], p));
  LV.forEach((p, i) => seg(L2[i >> 1], [p[0], p[1] - 9 / k]));
  const edges = new M(0, 0, g, 1); shape(edges, d, {stroke: C.faint, sw: 2, draw: false});
  const nodes = new M(0, 0, g, 1);
  [R, ...L1, ...L2].forEach((p, i) => { const [a, b] = S(p); shape(nodes, circ(a, b, i ? 5 : 7), {stroke: col, sw: 2, fill: C.stage, fo: 1, draw: false}); });
  g.slots = LV.map((p, i) => { const [a, b] = S(p); const m = new M(a, b, g, i >= filled ? 1 : 0); shape(m, rr(-9, -9, 18, 18, 3), {stroke: C.faint, sw: 1.5, dash: '3 3'}); return m; });
  g.leaves = LV.map((p, i) => {
    const [a, b] = S(p), c = i < filled ? col : newCol, m = new M(a, b, g, i < filled ? 1 : 0);
    shape(m, rr(-9, -9, 18, 18, 3), {fill: C.stage, fo: 1});
    shape(m, rr(-9, -9, 18, 18, 3), {stroke: c, sw: 2, fill: c, fo: 0.45, draw: false});
    return m;
  });
  g.pathTo = (i) => { const pts = [LV[i], L2[i >> 1], L1[i >> 2], R].map(S); return 'M' + pts.map((p) => p.join(',')).join(' L'); };
  return g;
}

/* ---------------- animation verbs ---------------- */
const arr = (x) => (Array.isArray(x) ? x.flat(Infinity) : [x]);
const A = {
  fadeIn(ms, t, d = 0.7, o = {}) {
    arr(ms).forEach((m, i) => {
      const tt = t + (o.lag || 0) * i;
      if (o.dx) { const x = m.get('x', tt); m.add('x', tt, d, x, smooth, x + o.dx); }
      if (o.dy) { const y = m.get('y', tt); m.add('y', tt, d, y, smooth, y + o.dy); }
      if (o.s0 != null) { const s = m.get('s', tt); m.add('s', tt, d, s, smooth, s * o.s0); }
      m.add('o', tt, d, o.to ?? 1);
    });
  },
  fadeOut(ms, t, d = 0.6, o = {}) { arr(ms).forEach((m, i) => m.add('o', t + (o.lag || 0) * i, d, 0)); },
  to(ms, t, d, p, o = {}) { arr(ms).forEach((m, i) => { const tt = t + (o.lag || 0) * i; for (const k in p) m.add(k, tt, d, p[k], o.e || smooth); }); },
  draw(ms, t, d = 1.1, o = {}) {
    arr(ms).forEach((m, i) => {
      const tt = t + (o.lag || 0) * i;
      if (!m.tr.d) m.base.d = 0;
      if (m.fills.length && !m.tr.f) m.base.f = 0;
      m.add('o', tt, 0.1, 1, lin);
      m.add('d', tt, d, 1);
      if (m.fills.length) m.add('f', tt + d * 0.45, d * 0.7, 1);
    });
  },
  write(ms, t, d = 1.1, o = {}) {
    arr(ms).forEach((m, i) => {
      const tt = t + (o.lag || 0) * i;
      m.needsMask = true;
      if (!m.tr.w) m.base.w = 0;
      m.add('o', tt, 0.1, 1, lin);
      m.add('w', tt, d, 1);
    });
  },
  pulse(ms, t, d = 0.8, k = 1.15) { arr(ms).forEach((m) => { const s = m.get('s', t); m.add('s', t, d / 2, s * k); m.add('s', t + d / 2, d / 2, s); }); },
  flash(m, t, d = 0.9) { if (!m.tr.fl) m.base.fl = 0; m.add('o', t, 0.05, 1, lin); m.add('fl', t, d, 1); m.add('o', t + d, 0.05, 0, lin); },
  handoff(a, b, t, d = 0.2) { a.add('o', t, d, 0); b.add('o', t, d, 1); },
  cam(t, d, p, e = smooth) { for (const k of ['cx', 'cy', 'z']) if (p[k] != null) CAM.add(k, t, d, p[k], e); },
  group(list, t, d, g) {
    for (const m of arr(list)) {
      const x = m.get('x', t), y = m.get('y', t), s = m.get('s', t);
      m.add('x', t, d, g.tx + g.k * (x - g.px)); m.add('y', t, d, g.ty + g.k * (y - g.py)); m.add('s', t, d, s * g.k);
    }
  },
};
function circum(x, y, w, h, col, t, o = {}) {
  const m = new M(x + w / 2, y + h / 2, null, 0);
  shape(m, rr(-w / 2, -h / 2, w, h, o.r ?? 10), {stroke: col, sw: o.sw ?? 3.5});
  A.draw(m, t, o.d ?? 0.6); A.fadeOut(m, t + (o.hold ?? 1.5), 0.5);
  return m;

const circumC = (cx, cy, w, h, col, t, o = {}) => circum(cx - w / 2 - 7, cy - h / 2 - 7, w + 14, h + 14, col, t, o);
function travel(from, to, t, d, target) {
  const m = Token(from[0], from[1], 'Π', C.gold, {r: 16, sw: 2.5});
  A.fadeIn(m, t, 0.2); A.to(m, t, d, {x: to[0], y: to[1]}); A.fadeOut(m, t + d - 0.15, 0.2);
  if (target) A.pulse(target, t + d - 0.1, 0.5, 1.3);
}

/* ---------------- words ---------------- */
const CAP = [
  'Alice pays Bob from a shielded pool. We follow her transaction from her wallet to a block and look at what each party checks along the way.',
  'Alice holds two notes in a shielded pool, worth 0.9 and 0.5 ETH. She wants to pay Bob 1.2 ETH without revealing her notes, the amounts or who she pays.',
  'Her wallet keeps the secret inputs to the proof: the notes she spends, the key that owns them, the Merkle paths showing they are in the tree, and the two new notes. This is the witness.',
  'The statement is what everyone sees: the tree root her paths lead to, one nullifier per spent note so it can’t be spent twice, one commitment per new note, the fee, and the binding, a hash of this transaction. Commitments hide amounts and owners, and only her key links a nullifier to its note, so no one learns which notes she spent.',
  'Her wallet runs the pool’s program on leanVM and proves that the statement satisfies the relation for some witness. The result is a zero-knowledge STARK, π, which reveals nothing about the witness.',
  'The proof will be checked against two 32-byte values: `data_hash`, a hash of the statement, and `program_id`, a hash of the pool’s program and its ISA version. The proposed program scheme puts `program_id` where today’s EIP-8288 has a verification key hash.',
  'The wallet builds one frame transaction. The first frame names the recent root, the pool’s `VERIFY` frame asks the pool to approve, the dependency frame holds `data_hash` and `program_id`, and the `SENDER` frame carries the public inputs. The binding sits in no frame. It is a hash of this transaction, so the wallet builds the transaction before it proves.',

const NOTE = [

  'leanVM is the zkVM and leanSTARK its proof system. A private transaction needs leanSTARK with zero knowledge; the leanVM commit pinned in the post’s EVM spend benchmark has no zero knowledge yet.',
  'Proposed program scheme for `0x11`: the third field of the 96-byte entry holds `program_id = hash(ISA version, program bytes)` instead of a verification key hash. For an EVM program the version is the fork whose rules it runs under. The program’s public output is `data_hash` itself: the program hashes the statement inside the proof, and the pool recomputes that hash in its `VERIFY` frame, so the hash should be cheap in both places. The animation uses Keccak-256, which is cheap in the EVM but would need a zkVM precompile in leanVM. Each fork specifies the verifier behind the scheme; the 30,000 gas and the mempool’s limit of one STARK per transaction stay as in EIP-8288.',
  'Frame 0 is EIP-8272’s recent root verifier frame: a `VERIFY` frame to the recent root contract at `0x…8272` with 72-byte `(source_id, slot, root)` tuples, placed before every frame except an optional `expiry_verify` frame. Frame 2 has `DEP_VERIFY_FRAME_MODE` = 3 (EIP-8288): no target, value 0, flags 0 and a gas limit of 30,000 per STARK. It comes after the pool’s `VERIFY` frame, so the validation prefix (the frames up to and including the one that sets the payer) keeps a shape EIP-8141 and EIP-8272 recognize. `VERIFY` = 1 and `SENDER` = 2 (EIP-8141). Mempool policy allows one leanSTARK dependency per transaction (`MAX_STARKS_PER_TX` = 1).',
  '`sender` = pool, and the pool’s `VERIFY` frame has flags `0x3`, which allow `APPROVE` of execution and payment, so the pool is both sender and payer. Here the nullifiers are EIP-8250 nonce keys at sequence 0, and `signatures` is empty because the proof’s binding replaces the secp256k1 signature from an `authorizer` address that today’s MSP requires. Other transactions that call the pool (shields, claims and root publications) come from ordinary accounts and still carry a leanSPHINCS signature dependency. The recent root verifier frame has flags 0, so it can only pass or fail.',
  '`program_id` is fixed when the pool is deployed. Because it names a program and an ISA version rather than one prover’s verification key, it keeps its meaning when a fork changes the prover.',
  '`FRAMEPARAM(0x02, i)` returns frame i’s mode and `FRAMEDATACOPY` copies its data (EIP-8288, Transaction Execution Visibility). EIP-8250 says applications with single-use keys, such as nullifiers, must authenticate at least `(sender, nonce_keys_hash, nonce_seq == 0)` in `VERIFY`, and the binding covers all three. An EIP-8272 frame only proves that a tuple is stored and recent, so the pool checks that the root source is its own. In a `VERIFY` frame only `APPROVE` can change state (EIP-8141). `APPROVE(0x3)` sets payer = pool and collects the maximum gas cost from its balance; the unused part is refunded after execution. The fee, which the relation takes out of Alice’s notes, must be at least that maximum, so other depositors’ ETH never pays her gas, and any surplus stays in the pool. The pool also checks the exact frame list (four frames with fixed modes and targets, no value, and one `settle` call), because once it approves execution every later `SENDER` frame acts as the pool and could move its ETH. It also checks that the statement’s domain matches its chain, its address and the epoch of the root the spend proves against, because under another domain the same note would get a second nullifier, so it could be spent twice.',
  'EIP-8250 consumes all of a transaction’s nonce keys atomically at payment approval, and they stay consumed if the `SENDER` frame later fails. A failed settlement would spend Alice’s notes without adding Bob’s note or her change. So the pool must make sure the new notes fit in its tree, and before approving it reads the `SENDER` frame’s execution and state gas limits with `FRAMEPARAM` (`0x01` and `0x09`) to check that they are enough to settle. EIP-8272 accepts roots at most 8,191 slots old (`RECENT_ROOT_USABLE_WINDOW`), and anyone can create a root source, which is why the pool must check `source_id`.',
  'The MSP tree has depth 20 and sequential inserts. A withdrawal instead credits its recipient here, and a separate claim call pays the ETH, so settlement makes no external call that could revert. Settlement also won’t run out of gas, as long as the gas limits the pool requires before approving cover settlement’s worst case. In the MSP the check that the tree has room always passes, because when the new notes don’t fit, settlement starts a new tree epoch for them.',

  '`AGGREGATION_INTERVAL` = 1000 ms. A node also prunes the dependencies of transactions that become unincludable, for example once another transaction consumes the same nonce key. EIP-8141 and EIP-8250 still allow one pending frame transaction per sender, so a node holds one transfer from this pool at a time until a keyed-nonce concurrency rule is adopted.',

/* ---------------- rendering ---------------- */
function render(t) {
  const z = CAM.get('z', t), cx = CAM.get('cx', t), cy = CAM.get('cy', t);
  WORLD.setAttribute('transform', `translate(800 450) scale(${z.toFixed(5)}) translate(${(-cx).toFixed(2)} ${(-cy).toFixed(2)})`);
  for (const m of MOBS) {
    const o = m.get('o', t);
    if (o <= 0.002) { if (m.vis !== 0) { m.g.setAttribute('display', 'none'); m.vis = 0; } continue; }
    if (m.vis !== 1) { m.g.removeAttribute('display'); m.vis = 1; }
    const x = m.get('x', t), y = m.get('y', t), s = m.get('s', t), r = m.get('r', t);
    m.g.setAttribute('transform', `translate(${x.toFixed(2)} ${y.toFixed(2)})${r ? ` rotate(${r.toFixed(2)})` : ''}${s !== 1 ? ` scale(${s.toFixed(4)})` : ''}`);
    m.g.setAttribute('opacity', o >= 0.998 ? '1' : o.toFixed(3));
    if (m.draws.length) {
      const d = m.get('d', t), full = d >= 0.999;
      for (const e of m.draws) {
        if (full) { e.removeAttribute('stroke-dasharray'); e.removeAttribute('stroke-dashoffset'); }
        else { e.setAttribute('stroke-dasharray', '1 1'); e.setAttribute('stroke-dashoffset', (1 - d).toFixed(4)); }
      }
      for (const h of m.heads) h.setAttribute('opacity', Math.min(1, Math.max(0, (d - 0.86) / 0.14)).toFixed(3));
    }
    if (m.fills.length) { const f = m.get('f', t); for (const [e, fo] of m.fills) e.setAttribute('fill-opacity', (fo * f).toFixed(3)); }
    if (m.mask) { const w = m.get('w', t); m.mask.rect.setAttribute('x', (m.mask.x0 + (m.mask.x1 - m.mask.x0) * w).toFixed(2)); }
    if (m.flashEl) { const fl = m.get('fl', t); m.flashEl.setAttribute('stroke-dashoffset', (m.flen - fl * (1 + m.flen)).toFixed(4)); }
  }
}
let maskN = 0;
function prepareMasks() {
  for (const m of MOBS) {
    if (!m.needsMask || m.mask) continue;
    const b = m.inner.getBBox();
    if (!b.width) continue;
    const rw = b.width * 1.35 + 12, pad = b.height;
    const id = 'wm' + (++maskN);
    const mask = mk('mask', {id, maskUnits: 'userSpaceOnUse', x: b.x - rw - 40, y: b.y - pad, width: b.width + rw + 80, height: b.height + 2 * pad}, DEFS);
    const rect = mk('rect', {x: b.x - rw - 2, y: b.y - pad, width: rw, height: b.height + 2 * pad, fill: 'url(#sweep)'}, mask);
    m.inner.setAttribute('mask', `url(#${id})`);
    m.mask = {rect, x0: b.x - rw - 2, x1: b.x - 2};
  }
}

/* ---------------- player ---------------- */
const TOTAL = T;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const cap = $('#cap'), note = $('#note'), fill = $('#fill'), knob = $('#knob'), timeEl = $('#time'), scrub = $('#scrub');
const playIcon = $('#playicon'), playBtn = $('#play'), bigplay = $('#bigplay'), bigplayTxt = $('#bigplaytxt');
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const fmt = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/π/g, '<span class="pi">π</span>');
const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const chNav = $('#chapters');
const chBtns = CHAPTERS.map(([name, ch]) => {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = name;
  b.addEventListener('click', () => { const i = BEATS.findIndex((x) => x.ch === ch); show(BEATS[i].t0 + 0.001); if (!playing) play(); });
  chNav.appendChild(b);
  return [b, ch];
});
const track = $('#track');
for (const [, ch] of CHAPTERS) { const d = document.createElement('div'); d.className = 'tick'; d.style.left = (100 * BEATS.find((x) => x.ch === ch).t0 / TOTAL) + '%'; track.appendChild(d); }
scrub.setAttribute('aria-valuemax', String(Math.round(TOTAL)));

let t = POSTER, playing = false, speed = 1, last = 0, started = false, cur = -1;
const beatAt = (tt) => { let i = 0; for (let k = 0; k < BEATS.length; k++) if (tt >= BEATS[k].t0 - 1e-6) i = k; return i; };
function show(tt) {
  t = Math.max(0, Math.min(TOTAL, tt));
  const i = beatAt(t);
  render(reduce && playing ? Math.min(BEATS[i].t1 - 0.02, TOTAL) : t);
  if (i !== cur) {
    cur = i;
    cap.innerHTML = fmt(BEATS[i].cap); note.innerHTML = fmt(BEATS[i].note);
    if (!reduce && cap.animate) cap.animate([{opacity: 0}, {opacity: 1}], {duration: 380, easing: 'ease-out'});
    for (const [b, ch] of chBtns) b.setAttribute('aria-current', String(ch === BEATS[i].ch));
  }
  const p = 100 * t / TOTAL;
  fill.style.width = p + '%'; knob.style.left = p + '%';
  scrub.setAttribute('aria-valuenow', String(Math.round(t)));
  scrub.setAttribute('aria-valuetext', `${mmss(t)} of ${mmss(TOTAL)}, step ${i + 1} of ${BEATS.length}`);
  timeEl.textContent = `${mmss(t)} / ${mmss(TOTAL)}`;
  playIcon.setAttribute('d', playing ? 'M6 4h4.5v16H6zM13.5 4H18v16h-4.5z' : 'M7 4l14 8-14 8z');
  playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
  const atEnd = t >= TOTAL - 0.01;
  bigplay.hidden = playing || (started && !atEnd);
  bigplayTxt.textContent = atEnd ? 'Replay' : 'Play';
}
function tick(ts) {
  if (!playing) return;
  const dt = Math.min(0.1, (ts - last) / 1000); last = ts;
  const nt = t + dt * speed;
  if (nt >= TOTAL) { playing = false; show(TOTAL); return; }
  show(nt);
  requestAnimationFrame(tick);
}
function play() { if (t >= TOTAL - 0.01) t = 0; playing = true; started = true; last = performance.now(); show(t); requestAnimationFrame(tick); }
function pause() { playing = false; show(t); }
const toggle = () => (playing ? pause() : play());
function next() {
  const i = beatAt(t);
  if (playing) { show(i + 1 < BEATS.length ? BEATS[i + 1].t0 : TOTAL); return; }
  started = true;
  const end = BEATS[i].t1 - 0.02;
  show(t < end - 0.05 ? end : (i + 1 < BEATS.length ? BEATS[i + 1].t1 - 0.02 : TOTAL));
}
function prev() {
  const i = beatAt(t);
  if (playing) { show(t - BEATS[i].t0 > 1.2 || i === 0 ? BEATS[i].t0 : BEATS[i - 1].t0); return; }
  started = true;
  show(i > 0 ? BEATS[i - 1].t1 - 0.02 : 0);
}
playBtn.addEventListener('click', toggle);
bigplay.addEventListener('click', () => { if (t >= TOTAL - 0.01 || !started) t = t >= TOTAL - 0.01 ? 0 : t; play(); });
$('#next').addEventListener('click', next);
$('#prev').addEventListener('click', prev);
$('#speed').addEventListener('change', (e) => { speed = +e.target.value; });
let dragging = false;
const seekX = (e) => { const r = track.getBoundingClientRect(); started = true; show(TOTAL * Math.min(1, Math.max(0, (e.clientX - r.left) / r.width))); };
scrub.addEventListener('pointerdown', (e) => { dragging = true; scrub.setPointerCapture(e.pointerId); seekX(e); });
scrub.addEventListener('pointermove', (e) => { if (dragging) seekX(e); });
scrub.addEventListener('pointerup', () => { dragging = false; });
scrub.addEventListener('pointercancel', () => { dragging = false; });
document.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('select, input, textarea')) return;
  if (e.key === ' ' && e.target.closest && e.target.closest('summary')) return;
  if (e.key === ' ' || e.key === 'k') { e.preventDefault(); toggle(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
  else if (e.key === 'Home') { e.preventDefault(); started = true; show(0); }
});

/* Test hooks: render any moment without playing. */
window.__anim = {seek: (s) => { playing = false; started = true; show(s); }, beats: BEATS, total: TOTAL};

function ready() {
  prepareMasks();
  WORLD.style.visibility = '';
  show(t);
}
const faces = ['400 24px KaTeX_Main', '700 24px KaTeX_Main', 'italic 400 24px KaTeX_Math', '400 24px KaTeX_Typewriter'];
let done = false;
const finish = () => { if (!done) { done = true; ready(); } };
Promise.all(faces.map((f) => document.fonts.load(f))).then(() => document.fonts.ready).then(finish, finish);
setTimeout(finish, 2500);
})();
</script>
